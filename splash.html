<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>D.</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      position: relative;
      display: grid;
      place-content: center;
      justify-items: center;
      background:
        radial-gradient(240px 190px at 50% 0%, rgba(124, 92, 255, 0.24), transparent 70%),
        radial-gradient(240px 170px at 50% 110%, rgba(255, 92, 138, 0.16), transparent 70%),
        #14151b;
      color: #ecebf3;
      font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      cursor: default;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .mark { position: relative; width: 96px; height: 96px; margin-top: -18px; }
    .mark svg { position: relative; width: 96px; height: 96px; animation: float 2.6s ease-in-out infinite; filter: drop-shadow(0 14px 26px rgba(124, 92, 255, 0.45)); }
    .mark::before {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 34px;
      border: 2px solid rgba(169, 149, 255, 0.35);
      animation: ring 2.6s ease-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-6px) scale(1.03); } }
    @keyframes ring { from { transform: scale(0.82); opacity: 1; } to { transform: scale(1.18); opacity: 0; } }
    .status { margin-top: 30px; font-size: 15px; font-weight: 600; min-height: 22px; text-align: center; }
    .sub { margin-top: 2px; min-height: 18px; color: #8d8ca3; font-size: 12px; font-variant-numeric: tabular-nums; }
    .bar { width: 190px; height: 6px; margin-top: 10px; border-radius: 3px; background: #2c2e3a; overflow: hidden; visibility: hidden; }
    .bar.show { visibility: visible; }
    .bar i { display: block; width: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c5cff, #ff5c8a); transition: width 0.3s; }
    .bar.busy i { width: 38%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
    .skip { margin-top: 14px; color: #a995ff; font-size: 12.5px; text-decoration: none; visibility: hidden; -webkit-app-region: no-drag; cursor: pointer; }
    .skip.show { visibility: visible; }
    .skip:hover { text-decoration: underline; }
    .tip { position: absolute; left: 22px; right: 22px; bottom: 18px; color: #7f7f93; font-size: 11.5px; text-align: center; }
  </style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7c5cff"/>
          <stop offset="1" stop-color="#ff5c8a"/>
        </linearGradient>
      </defs>
      <rect width="256" height="256" rx="64" fill="url(#g)"/>
      <path fill="#fff" fill-rule="evenodd" d="M62 58h52c44 0 76 29 76 70s-32 70-76 70H62Zm34 30v80h17c25 0 42-15 42-40s-17-40-42-40Z"/>
      <circle cx="214" cy="183" r="15" fill="#fff"/>
    </svg>
  </div>
  <div class="status" id="status">Başlatılıyor…</div>
  <div class="sub" id="sub"></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <a class="skip" id="skip" href="#skip">Şimdi değil, sonra yükle</a>
  <div class="tip" id="tip"></div>

  <script>
    // Ana süreç durumu executeJavaScript ile setStatus(...) çağırarak gönderir.
    const TIPS = [
      'Ctrl+Shift+M ile mikrofonunu her uygulamadan kapatabilirsin.',
      'Yayın kalitesini yayın sürerken de değiştirebilirsin.',
      'Boş mesaj kutusunda ↑ tuşu son mesajını düzenler.',
      'Birine sağ tıklayıp sesini ayrı ayarlayabilirsin.',
      'Pencereyi kapatınca D. tepside çalışmaya devam eder.',
      'Gürültü engellemeyi Ayarlar → Ses bölümünden seçebilirsin.',
      'Dosyaları sohbete sürükleyip bırakarak gönderebilirsin.',
    ];
    const LABELS = {
      checking: 'Güncellemeler denetleniyor…',
      downloading: 'Güncelleme indiriliyor',
      ready: 'Güncelleme yükleniyor…',
    };
    const $ = (id) => document.getElementById(id);
    const mb = (bytes) => Math.round(bytes / 1048576);
    let skipTimer = null;

    $('tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

    function setStatus(s) {
      const downloading = s.state === 'downloading';
      $('status').textContent = LABELS[s.state] || 'Başlatılıyor…';
      $('bar').classList.toggle('show', downloading || s.state === 'ready');
      $('bar').classList.toggle('busy', s.state === 'ready' || (downloading && !s.total));
      $('fill').style.width = downloading && s.total ? `${s.percent}%` : '';
      $('sub').textContent = downloading && s.total
        ? `${mb(s.transferred)} / ${mb(s.total)} MB · sürüm ${s.version}`
        : s.state === 'ready' ? `Sürüm ${s.version}` : '';
      // Uzun süren indirmede beklemeden devam edilebilir; güncelleme arka planda iner.
      if (downloading && !skipTimer) skipTimer = setTimeout(() => $('skip').classList.add('show'), 4000);
      if (!downloading) $('skip').classList.remove('show');
    }
  </script>
</body>
</html>
